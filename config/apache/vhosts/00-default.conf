# DevForge Default Catch-All VirtualHost
# Handles http://localhost, http://127.0.0.1, and any unmatched requests

<VirtualHost *:80>
    ServerName localhost
    ServerAlias 127.0.0.1
    DocumentRoot "C:/DevForge/projects"

    <Directory "C:/DevForge/projects">
        Options Indexes FollowSymLinks ExecCGI
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "C:/DevForge/logs/localhost_error.log"
    CustomLog "C:/DevForge/logs/localhost_access.log" common
</VirtualHost>
