<VirtualHost *:80>
    ServerName phpmyadmin.test
    ServerAlias www.phpmyadmin.test
    DocumentRoot "C:/DevForge/bin/phpmyadmin"
    <Directory "C:/DevForge/bin/phpmyadmin">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog "C:/DevForge/logs/phpmyadmin_error.log"
    CustomLog "C:/DevForge/logs/phpmyadmin_access.log" common
</VirtualHost>
