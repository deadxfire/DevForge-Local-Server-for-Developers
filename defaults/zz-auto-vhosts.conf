# DevForge Dynamic Auto-VirtualHost for Future Projects
# Loaded last so explicit virtual hosts take precedence

<VirtualHost *:80>
    ServerName autovhost.local
    ServerAlias *.test

    DocumentRoot "C:/DevForge/projects"

    <Directory "C:/DevForge/projects">
        Options Indexes FollowSymLinks ExecCGI
        AllowOverride All
        Require all granted
    </Directory>

    <IfModule rewrite_module>
        RewriteEngine On

        # 1. Route to project /dist if dist/index.html exists (e.g. Vite, React, modern frontend build)
        RewriteCond %{ENV:REDIRECT_STATUS} ^$
        RewriteCond %{HTTP_HOST} ^([a-zA-Z0-9_-]+)\.test$ [NC]
        RewriteCond "C:/DevForge/projects/%1/dist/index.html" -f
        RewriteRule ^/(.*)$ "C:/DevForge/projects/%1/dist/$1" [L]

        # 2. Route to project /build if build/index.html exists (e.g. CRA, Next.js static)
        RewriteCond %{ENV:REDIRECT_STATUS} ^$
        RewriteCond %{HTTP_HOST} ^([a-zA-Z0-9_-]+)\.test$ [NC]
        RewriteCond "C:/DevForge/projects/%1/build/index.html" -f
        RewriteRule ^/(.*)$ "C:/DevForge/projects/%1/build/$1" [L]

        # 3. Route to project /public if public/index.html or public/index.php exists
        RewriteCond %{ENV:REDIRECT_STATUS} ^$
        RewriteCond %{HTTP_HOST} ^([a-zA-Z0-9_-]+)\.test$ [NC]
        RewriteCond "C:/DevForge/projects/%1/public/index.html" -f [OR]
        RewriteCond "C:/DevForge/projects/%1/public/index.php" -f
        RewriteRule ^/(.*)$ "C:/DevForge/projects/%1/public/$1" [L]

        # 4. Route to project /public if it exists (e.g. Laravel)
        RewriteCond %{ENV:REDIRECT_STATUS} ^$
        RewriteCond %{HTTP_HOST} ^([a-zA-Z0-9_-]+)\.test$ [NC]
        RewriteCond "C:/DevForge/projects/%1/public" -d
        RewriteRule ^/(.*)$ "C:/DevForge/projects/%1/public/$1" [L]

        # 5. Route to project root folder if it exists (e.g. WordPress, standard PHP, HTML)
        RewriteCond %{ENV:REDIRECT_STATUS} ^$
        RewriteCond %{HTTP_HOST} ^([a-zA-Z0-9_-]+)\.test$ [NC]
        RewriteCond "C:/DevForge/projects/%1" -d
        RewriteRule ^/(.*)$ "C:/DevForge/projects/%1/$1" [L]
    </IfModule>

    ErrorLog "C:/DevForge/logs/auto_vhosts_error.log"
    CustomLog "C:/DevForge/logs/auto_vhosts_access.log" common
</VirtualHost>
